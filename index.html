<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Trap System | Enterprise DDoS & Threat Defense</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050811;
            --bg-card: #0c1222;
            --neon-cyan: #00f3ff;
            --neon-green: #00ff66;
            --neon-red: #ff2a5f;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 102, 0.06), transparent 25%);
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(5, 8, 17, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .logo span {
            color: var(--neon-green);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
            color: var(--neon-green);
            font-size: 0.95rem;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 8% 50px;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 750px;
            margin: 0 auto 35px;
        }

        .cta-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(45deg, var(--neon-cyan), #0077ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: 0.3s;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
        }

        /* Live Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            padding: 20px 8%;
            margin-bottom: 60px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        }

        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 8px;
        }

        .stat-number.green { color: var(--neon-green); }
        .stat-number.red { color: var(--neon-red); }

        .stat-label {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Features Section */
        .section-title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 40px;
            color: #fff;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 0 8% 70px;
        }

        .feature-box {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s;
        }

        .feature-box:hover {
            border-color: var(--neon-cyan);
            transform: translateY(-5px);
        }

        .feature-box h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-cyan);
            margin-bottom: 12px;
        }

        .feature-box p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Pricing & Payment Section */
        .checkout-section {
            padding: 50px 8% 80px;
            display: flex;
            justify-content: center;
        }

        .checkout-container {
            background: var(--bg-card);
            border: 1px solid var(--neon-cyan);
            border-radius: 15px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
            .hero h1 { font-size: 2.2rem; }
        }

        .plan-details h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            margin-bottom: 15px;
        }

        .price-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            margin: 15px 0;
        }

        .price-tag span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .plan-list {
            list-style: none;
            margin: 20px 0;
        }

        .plan-list li {
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .plan-list li::before {
            content: '✔';
            color: var(--neon-green);
            font-weight: bold;
        }

        .payment-box-info {
            background: rgba(0, 243, 255, 0.08);
            border-left: 4px solid var(--neon-cyan);
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .payment-box-info p {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        /* Form Styling */
        .order-form h3 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 20px;
            color: var(--neon-cyan);
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            background: #050811;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--neon-green), #00b347);
            border: none;
            border-radius: 6px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 1rem;
        }
    </style>
</head>
