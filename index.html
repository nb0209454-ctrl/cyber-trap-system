<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTrap Quantum Matrix</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #030712; }
        .cyber-panel { background: linear-gradient(145deg, #0b1329, #080e1e); border: 1px solid #1e293b; }
        .neon-glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.25); text-shadow: 0 0 10px rgba(239, 68, 68, 0.6); }
    </style>
</head>
<body class="text-slate-100 font-mono p-4 min-h-screen flex flex-col justify-between">
    <header class="cyber-panel rounded-2xl p-4 flex justify-between items-center">
        <div>
            <h1 class="text-xs font-black text-slate-400">CORE_ENGINE</h1>
            <p class="text-[14px] text-red-500 font-extrabold neon-glow-red">QUANTUM_TRAP v2.0</p>
        </div>
        <button onclick="syncMatrixMetrics()" class="text-[11px] text-slate-400 border border-slate-700 bg-slate-900 px-3 py-1 rounded-lg">SYNC</button>
    </header>
    <main class="my-4 flex-grow space-y-4">
        <div class="cyber-panel rounded-2xl p-6 text-center">
            <h3 class="text-[10px] text-slate-400 font-bold uppercase">ক্র্যাশ ও লক হওয়া হ্যাকিং ডিভাইস</h3>
            <div id="counter-value" class="text-7xl font-black text-red-500 my-2 neon-glow-red">0</div>
        </div>
        <div class="cyber-panel rounded-2xl p-4">
            <div id="logs-anchor" class="space-y-3"></div>
            <div id="secure-state" class="text-center py-16 text-slate-500 text-xs">ALL SYSTEMS SECURE</div>
        </div>
    </main>
    <script>
        async function syncMatrixMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();
                document.getElementById('counter-value').innerText = data.total_intercepted;
                const anchor = document.getElementById('logs-anchor');
                const secureState = document.getElementById('secure-state');
                if (data.total_intercepted > 0) {
                    secureState.classList.add('hidden');
                    anchor.innerHTML = data.logs.map(function(log) {
                        return '<div class="bg-[#050914] border border-red-950 p-3 rounded-xl"><div class="flex justify-between"><span class="text-red-400 font-bold text-xs">IP: ' + log.attacker_ip + '</span><span class="text-[8px] bg-red-600/10 text-red-500 px-2 py-0.5 rounded">' + log.mitigation + '</span></div></div>';
                    }).join('');
                }
            } catch (err) { console.log(err); }
        }
        setInterval(syncMatrixMetrics, 2500);
        window.onload = syncMatrixMetrics;
    </script>
</body>
</html>
