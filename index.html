<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Engine | Quantum Trap v2.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #070b14;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #0f172a;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 35px 25px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
    }
    .badge {
      display: inline-block;
      background-color: rgba(0, 255, 204, 0.1);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 28px;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .sync-btn {
      background-color: #00ffcc;
      color: #070b14;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      margin-bottom: 28px;
      width: 100%;
    }
    .sync-btn:hover {
      background-color: #00d4aa;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }
    .sync-btn:disabled {
      background-color: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    .panel {
      background-color: #070b14;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 20px;
    }
    .panel-title {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .counter {
      font-size: 42px;
      font-weight: bold;
      color: #ffffff;
      margin: 8px 0;
    }
    .status {
      font-size: 14px;
      font-weight: bold;
      color: #10b981;
      letter-spacing: 1.5px;
      margin-top: 8px;
    }
    .log-box {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
      text-align: left;
      background-color: #04070d;
      padding: 10px;
      border-radius: 6px;
      border-left: 3px solid #00ffcc;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">SYSTEM ONLINE</div>
    <h1>CORE_ENGINE</h1>
    <div class="subtitle">QUANTUM_TRAP v2.0</div>

    <button class="sync-btn" id="syncBtn" onclick="runSync()">SYNC SYSTEM</button>

    <div class="panel">
      <div class="panel-title">Crash and Locked Hacking Devices</div>
      <div class="counter" id="deviceCount">0</div>
      <div class="status" id="systemStatus">ALL SYSTEMS SECURE</div>
    </div>

    <div class="log-box" id="logBox">
      > Ready. Waiting for manual sync...
    </div>
  </div>

  <script>
    function runSync() {
      const btn = document.getElementById('syncBtn');
      const status = document.getElementById('systemStatus');
      const logBox = document.getElementById('logBox');

      btn.disabled = true;
      btn.innerText = "SYNCING...";
      status.innerText = "SCANNING NETWORK...";
      status.style.color = "#f59e0b";
      logBox.innerHTML = "> Connecting to Quantum Trap nodes...";

      setTimeout(() => {
        logBox.innerHTML = "> Verifying firewall & trap protocols...";
      }, 800);

      setTimeout(() => {
        btn.disabled = false;
        btn.innerText = "SYNC SYSTEM";
        status.innerText = "ALL SYSTEMS SECURE";
        status.style.color = "#10b981";
        const now = new Date().toLocaleTimeString();
        logBox.innerHTML = `> Sync complete at ${now}. No threats found.`;
      }, 1800);
    }
  </script>

</body>
</html>
